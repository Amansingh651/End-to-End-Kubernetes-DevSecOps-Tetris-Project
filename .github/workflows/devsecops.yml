name: DevSecOps CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Tetris-V1/package-lock.json

      - name: Install dependencies
        working-directory: ./Tetris-V1
        run: npm ci

      - name: Build React application
        working-directory: ./Tetris-V1
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run build

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          severity: 'CRITICAL,HIGH,MEDIUM'
          format: 'table'
          exit-code: '0'

      - name: Build Docker image
        run: |
          docker build \
            -t tetris-v1:ci \
            -f Tetris-V1/Dockerfile \
            Tetris-V1

      - name: Run Trivy Docker image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'tetris-v1:ci'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH,MEDIUM'
          format: 'table'
          exit-code: '0'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-platform Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Tetris-V1
          file: ./Tetris-V1/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/amansingh651/tetris-v1:latest
            ghcr.io/amansingh651/tetris-v1:${{ github.sha }}
