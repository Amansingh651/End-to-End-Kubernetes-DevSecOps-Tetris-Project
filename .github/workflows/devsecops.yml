name: DevSecOps CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Tetris-V1/package-lock.json

      - name: Install dependencies
        working-directory: ./Tetris-V1
        run: npm ci

      - name: Build React application
        working-directory: ./Tetris-V1
        run: npm run build

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          severity: 'CRITICAL,HIGH,MEDIUM'
          format: 'table'
          exit-code: '0'

      - name: Build Docker image
        run: |
          docker build \
            -t tetris-v1:ci \
            -f Tetris-V1/Dockerfile \
            Tetris-V1
            
      - name: Run Trivy Docker image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'tetris-v1:ci'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH,MEDIUM'
          format: 'table'
          exit-code: '0'